name: aurafit
description: "AURA FIT AI: log Indian meals in under a minute and get safe, personal targets."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.13.7

# The same packages and versions as Penny, which already runs them in
# production.
dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  google_sign_in: ^7.2.0
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/foods.json

# The launcher icons, from the images tool/render_icon_test.dart draws:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 26
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#050816"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
