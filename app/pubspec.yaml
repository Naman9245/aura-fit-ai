name: aurafit
description: "AURA FIT AI: log Indian meals in under a minute and get safe, personal targets."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

# The same packages and versions as Penny, which already runs them in
# production. supabase_flutter joins with sign-in in January, when something
# first uses it; until then it would only add size.
dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
